name: Backend Quality

on:
  push:
    branches:
      - develop
      - 'phase/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase02-quality:
    name: Phase 02 focused quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Pint scoped check
        run: |
          vendor/bin/pint --test \
            app/Actions/Payment \
            app/Actions/Registration \
            app/Enums \
            app/Models \
            database/migrations/2026_10_03_120000_create_phase02_registration_payment_tables.php \
            tests/Feature/Phase02

      - name: PHPStan scoped analysis
        run: |
          vendor/bin/phpstan analyse \
            app/Actions/Payment \
            app/Actions/Registration \
            app/Enums \
            app/Models \
            database/migrations/2026_10_03_120000_create_phase02_registration_payment_tables.php \
            --memory-limit=1G \
            --no-progress

      - name: Phase 02 focused Pest
        run: php artisan test tests/Feature/Phase02/RegistrationPaymentDomainTest.php

      - name: Related foundation regression
        run: |
          php artisan test \
            tests/Feature/Foundation/AuthorizationFoundationTest.php \
            tests/Feature/Foundation/SuperAdminAuthorizationFoundationTest.php \
            tests/Feature/Foundation/FoundationalSeedersTest.php \
            tests/Feature/Foundation/FilesystemFoundationTest.php

  mysql-clean-migration:
    name: MySQL clean migration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iches_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: iches_ci
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_0900_ai_ci
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: private

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Clean migrate and seed
        run: php artisan migrate:fresh --seed --force
